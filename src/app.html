<!doctype html>
<html lang="ru" data-theme="dark" data-accent="teal">
  <head>
    <meta charset="utf-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2300B294'/%3E%3Crect x='8' y='8' width='16' height='16' fill='%230a0a0a'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('ng-theme') || 'dark'
          var a = localStorage.getItem('ng-accent') || 'teal'
          var e = document.documentElement
          e.setAttribute('data-theme', t)
          e.setAttribute('data-accent', a)
        } catch (e) {}
      })()
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
